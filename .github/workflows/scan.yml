name: scan
run-name: ${{ inputs.competitor_id && format('Crawl4AI - concurrent {0}', inputs.competitor_id) || inputs.user_id && 'Crawl4AI - lancer le scan' || 'Crawl4AI - scan planifié' }}
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      competitor_id:
        description: "ID d'un concurrent (vide = non utilisé)"
        required: false
        default: ""
      user_id:
        description: "ID d'un utilisateur (vide = tous les concurrents actifs)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: scan-${{ inputs.competitor_id || inputs.user_id || 'all' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install crawl4ai requests
      - run: crawl4ai-setup && python -m playwright install --with-deps chromium
      - run: python scan.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPETITOR_ID: ${{ inputs.competitor_id }}
          USER_ID: ${{ inputs.user_id }}
          CRAWL4AI_NO_CLOUD_NOTICE: "1"
