name: scan
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      competitor_id:
        description: "ID du concurrent (vide = tous les concurrents actifs)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: scan-${{ inputs.competitor_id || 'all' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install crawl4ai requests
      - run: crawl4ai-setup && python -m playwright install --with-deps chromium
      - run: python scan.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPETITOR_ID: ${{ inputs.competitor_id }}
